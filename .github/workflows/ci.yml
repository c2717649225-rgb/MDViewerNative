name: Windows build and regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Check changed-line whitespace
        shell: pwsh
        run: |
          # No --root: the snapshot history's initial commit contains the CommonMark
          # spec corpus, whose trailing whitespace is semantic hard breaks.
          # -M: renamed fixture files (samples corpus) keep their semantic whitespace
          # without being re-checked line by line as additions.
          git diff-tree --check -M -m --first-parent -r HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Changed-line whitespace check failed.' }
      - name: Verify (formatting, self-tests, specification baseline, corpus)
        shell: pwsh
        run: ./build.ps1 -Task Verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-results
          path: selftest/spec_fail.txt
