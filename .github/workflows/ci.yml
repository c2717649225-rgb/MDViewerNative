name: Windows build and regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Check changed-line whitespace
        shell: pwsh
        run: |
          # No --root: the snapshot history's initial commit contains the CommonMark
          # spec corpus, whose trailing whitespace is semantic hard breaks.
          git diff-tree --check -m --first-parent -r HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Changed-line whitespace check failed.' }
      - name: Exclude the workspace from Windows Defender
        shell: pwsh
        run: |
          # The runner's realtime scanner otherwise removes the freshly published
          # unsigned NativeAOT executable before packaging can see it.
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -ErrorAction SilentlyContinue
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
      - name: Verify and publish NativeAOT
        shell: pwsh
        run: ./build.ps1 -Task Publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-results
          path: |
            artifacts/MDViewerNative-win-x64.zip
            artifacts/MDViewerNative-win-x64.zip.sha256
            artifacts/MDViewerNative-win-x64.zip.manifest.json
            selftest/spec_fail.txt
