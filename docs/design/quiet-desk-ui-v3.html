<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安静的书桌 · 界面设计演示（第三版）</title>
<style>
/* =================================================================
   第三版：形用古意，词用白话
   - 位置遵循 Windows 惯例：标签在上、滚动在右、关闭在右上
   - 能点的东西长得像能点；功能用双字白话标注
   - 保留：书签绳、朱笔圈、卷目、竖排、信笺、墨晕切换
   ================================================================= */
:root{
  --fs:17px;
  --serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Source Han Serif CN","思源宋体","Songti SC","STSong","SimSun",serif;
  --sans:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;
  --latin:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"Microsoft YaHei UI",monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --ox:50vw; --oy:0px;
}
/* 所有次要文字对比度 ≥ 4.5:1 */
html[data-theme="paper"]{
  --desk:#ebe4d6; --desk-2:#e1d9c9; --paper:#f6f1e7; --paper-2:#ede6d8; --edge:#ddd3c0;
  --ink:#2a2521; --ink-2:#544c43; --muted:#6c6358; --faint:#b3a894; --rule:#e2d8c6; --rule-2:#cfc3ad;
  --accent:#b0361f; --accent-soft:rgba(176,54,31,.08); --wash:rgba(214,120,60,.22); --sel:rgba(176,54,31,.16);
  --shadow:rgba(70,45,20,.2); --grain:1; --letter:rgba(176,54,31,.14); --lamp:none;
  --k:#a3402c; --t:#3f5f7a; --s:#556e35; --n:#8e5b25; --c:#6b6458;
}
html[data-theme="celadon"]{
  --desk:#bfd0bb; --desk-2:#b4c7b0; --paper:#cddcc9; --paper-2:#c2d3be; --edge:#b3c6af;
  --ink:#1b2a23; --ink-2:#34463d; --muted:#44554c; --faint:#8fa592; --rule:#b8cab4; --rule-2:#a3b89f;
  --accent:#8f2f1d; --accent-soft:rgba(143,47,29,.09); --wash:rgba(190,110,50,.24); --sel:rgba(40,90,70,.2);
  --shadow:rgba(20,50,35,.22); --grain:.8; --letter:rgba(156,53,34,.16); --lamp:none;
  --k:#953928; --t:#244f63; --s:#36603b; --n:#754e1b; --c:#4b5a52;
}
html[data-theme="white"]{
  --desk:#f0f0ef; --desk-2:#e6e6e4; --paper:#ffffff; --paper-2:#f4f4f2; --edge:#e0e0de;
  --ink:#141414; --ink-2:#3d3d3d; --muted:#666666; --faint:#b0b0b0; --rule:#e6e6e6; --rule-2:#cfcfcf;
  --accent:#b0301a; --accent-soft:rgba(176,48,26,.07); --wash:rgba(255,190,60,.35); --sel:rgba(176,48,26,.15);
  --shadow:rgba(0,0,0,.16); --grain:0; --letter:rgba(176,48,26,.13); --lamp:none;
  --k:#a3321f; --t:#1f4f7a; --s:#3d6b1f; --n:#935a14; --c:#6e6e6e;
}
html[data-theme="lamp"]{
  --desk:#141311; --desk-2:#1b1a17; --paper:#1c1a18; --paper-2:#252320; --edge:#302c28;
  --ink:#e6dccb; --ink-2:#bdb2a1; --muted:#9a8f80; --faint:#5a534b; --rule:#2f2c28; --rule-2:#433e38;
  --accent:#e0805f; --accent-soft:rgba(224,128,95,.1); --wash:rgba(224,128,95,.26); --sel:rgba(224,128,95,.26);
  --shadow:rgba(0,0,0,.6); --grain:.45; --letter:rgba(224,128,95,.13);
  --lamp:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(255,196,130,.08),transparent 70%),radial-gradient(ellipse 130% 110% at 50% 40%,transparent 62%,rgba(0,0,0,.22) 100%);
  --k:#e8957a; --t:#98b8cf; --s:#aec78c; --n:#ddae70; --c:#918b80;
}

/* 高对比度：Windows 开启时由系统颜色接管（forced-colors），这里的 hc 只用于演示预览 */
html[data-theme="hc"]{
  --desk:#000; --desk-2:#1a1a1a; --paper:#000; --paper-2:#000; --edge:#fff;
  --ink:#fff; --ink-2:#fff; --muted:#fff; --faint:#fff; --rule:#fff; --rule-2:#fff;
  --accent:#ffff00; --accent-soft:transparent; --wash:transparent; --sel:#1aebff;
  --shadow:transparent; --grain:0; --letter:#fff; --lamp:none;
  --k:#ffff00; --t:#1aebff; --s:#3ff23f; --n:#ffff00; --c:#fff;
}
html[data-theme="hc"] .paper::before{display:none}
html[data-theme="hc"] mark.hit{outline:1px solid #1aebff;color:#1aebff}
html[data-theme="hc"] mark.hit.cur{background:#ffff00;color:#000;outline:none}
html[data-theme="hc"] .codebox,html[data-theme="hc"] .callout,html[data-theme="hc"] .editbar button,html[data-theme="hc"] .tab.active,html[data-theme="hc"] .pop,html[data-theme="hc"] .pal,html[data-theme="hc"] .findbar,html[data-theme="hc"] .card,html[data-theme="hc"] .cont{border:1px solid #fff}
html[data-theme="hc"] .jm .here,html[data-theme="hc"] .btn.primary{background:#ffff00;color:#000}
html[data-theme="hc"] .tip,html[data-theme="hc"] .toast{background:#fff;color:#000}
html[data-theme="hc"] .cord i,html[data-theme="hc"] .back .flag{background:#ffff00}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--sans);color:var(--ink);background:var(--desk);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
::selection{background:var(--sel)}
kbd{font-family:var(--sans);font-size:.76em;padding:.05em .45em;border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:5px;color:var(--ink-2);background:var(--paper);white-space:nowrap}
:focus-visible{outline:1.5px solid color-mix(in srgb,var(--accent) 75%,transparent);outline-offset:1px;border-radius:6px}
.scroll:focus-visible{outline:none}

/* 纸张切换：墨从点击处晕开 */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:inkspread .9s cubic-bezier(.6,.05,.3,1) both}
@keyframes inkspread{from{clip-path:circle(0 at var(--ox) var(--oy))}to{clip-path:circle(160vmax at var(--ox) var(--oy))}}

.app{height:100vh;display:grid;grid-template-rows:44px 1fr}

/* ================= 顶栏：印章 · 标签 · 工具 · 窗口按钮 ================= */
.bar{display:flex;align-items:stretch;background:var(--desk);user-select:none;position:relative;z-index:30}
.seal{width:54px;display:grid;place-items:center;flex:none}
.seal i{width:24px;height:24px;display:grid;place-items:center;font-style:normal;background:var(--accent);color:#fbf3e8;font-family:var(--serif);font-size:13.5px;font-weight:700;border-radius:4px;transform:rotate(-4deg);
  box-shadow:inset 0 0 0 1.5px rgba(255,245,230,.5),inset 0 0 0 3px var(--accent);transition:transform .4s var(--ease)}
.seal:hover i{transform:rotate(0) scale(1.07)}
.tabs{display:flex;align-items:flex-end;gap:2px;min-width:0;overflow:hidden}
.tab{position:relative;height:36px;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;border-radius:9px 9px 0 0;font-size:12.5px;color:var(--ink-2);max-width:220px;min-width:0;cursor:default;transition:background-color .2s,color .2s}
.tab .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:var(--desk-2);color:var(--ink)}
.tab.active{background:var(--paper);color:var(--ink)}
.tab.active::after{content:"";position:absolute;left:14px;right:14px;top:0;height:2px;border-radius:0 0 2px 2px;background:var(--accent)}
.tab.active::before{content:"";position:absolute;bottom:0;left:-9px;right:-9px;height:9px;pointer-events:none;
  background:radial-gradient(circle at 0 0,transparent 8.5px,var(--paper) 9px) left bottom/9px 9px no-repeat,radial-gradient(circle at 100% 0,transparent 8.5px,var(--paper) 9px) right bottom/9px 9px no-repeat}
.tab .ico{width:14px;height:14px;flex:none;color:var(--muted)}
.tab .x{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none;color:var(--muted)}
.tab .x:hover{background:var(--desk-2);color:var(--ink)}
.tab.active .x:hover{background:var(--paper-2)}
.tab .x svg{width:10px;height:10px}
.tab .dot{display:none;width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.3) 0,rgba(255,255,255,.08) 1.4px,transparent 2.4px),var(--accent);
  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 16%,transparent)}
.tab.dirty.fresh-ink .dot{animation:inkdrop .45s var(--ease)}
@keyframes inkdrop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
/* 保存：墨干了——先失去光泽、收一点，再淡去 */
.tab.drying .dot{display:block;animation:inkdry 1.2s ease-in forwards}
.tab.drying .x svg{display:none}
@keyframes inkdry{
  0%{transform:scale(1);opacity:1}
  35%{transform:scale(.9);opacity:1;background:var(--accent);box-shadow:none;filter:saturate(.75) brightness(.92)}
  100%{transform:scale(.55);opacity:0;background:var(--accent);box-shadow:none;filter:saturate(.6) brightness(.9)}}
.tab.dirty .dot{display:block}.tab.dirty .x svg{display:none}
.tab.dirty .x:hover .dot{display:none}.tab.dirty .x:hover svg{display:block}
.tab-add{align-self:center;height:28px;width:28px;margin:6px 0 0 4px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.tab-add:hover{background:var(--desk-2);color:var(--ink)}
.drag{flex:1;min-width:24px}
.tools{display:flex;align-items:center;gap:2px;padding-right:6px}
.tb{height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;transition:background-color .2s,color .6s}
/* 往下读时，工具栏退后一步（仍然看得见、对比度 ≥ 4.5）；往上滚、鼠标移过去、键盘聚焦时回来 */
#titlebar.quiet .tb:not(.on),#titlebar.quiet .seg button,#titlebar.quiet .tab:not(.active),#titlebar.quiet .tab-add,#titlebar.quiet .caption button{color:var(--muted)}
#titlebar.quiet .seg button.on{background:transparent;box-shadow:none;color:var(--ink-2)}
#titlebar .seg button,#titlebar .tab,#titlebar .caption button{transition:color .6s,background-color .4s,box-shadow .4s}
.tb svg{width:16px;height:16px;flex:none}
.tb:hover{background:var(--desk-2);color:var(--ink)}
.tb.on{background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 85%,var(--ink))}
.tb:disabled{opacity:.35;pointer-events:none}
.seg{display:flex;padding:3px;margin:0 4px;border-radius:9px;background:var(--desk-2);font-size:12.5px}
.seg button{white-space:nowrap;padding:3px 11px;border-radius:6px;color:var(--ink-2);transition:all .25s var(--ease)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.seg.disabled{opacity:.35;pointer-events:none}
.sep{width:1px;height:18px;background:var(--rule-2);margin:0 4px}
.caption{display:flex}
.caption button{width:46px;display:grid;place-items:center;color:var(--ink-2)}
.caption button:hover{background:var(--desk-2)}
.caption button.close:hover{background:#c42b1c;color:#fff}
.caption svg{width:10px;height:10px}
@media (max-width:1180px){.tb span{display:none}.tb{padding:0 8px}.tab.is-home .t{display:none}.tab.is-home{padding:0 12px}}

/* ================= 纸面 ================= */
.paper{position:relative;background:var(--paper);overflow:hidden}
.paper::before,.paper::after{content:"";position:absolute;inset:0;pointer-events:none}
.paper::before{z-index:1;opacity:var(--grain);mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
html[data-theme="lamp"] .paper::before{mix-blend-mode:screen}
.paper::after{z-index:25;background:var(--lamp)}
.scroll{position:absolute;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll.vert{writing-mode:vertical-rl;overflow-x:auto;overflow-y:hidden}
#view{position:relative}
#view.enter{animation:enter .55s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vert #view.enter{animation:enterv .55s var(--ease)}
@keyframes enterv{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
#inkLayer{position:absolute;inset:0;pointer-events:none;z-index:3}

/* ================= 正文（逻辑属性，横竖通用） ================= */
.doc{padding-block:60px 110px;padding-inline:48px 30px;font-size:var(--fs);line-height:1.9;text-align:justify;line-break:strict;overflow-wrap:break-word}
html[data-font="serif"] .doc{font-family:var(--serif)}
.vert .doc{padding:56px 72px 96px 72px;height:100%;line-height:2.05}
.doc-head{margin-block:0 3em;padding-block-end:2.1em;border-block-end:1px solid var(--rule)}
.kicker{font-family:var(--serif);font-size:.76em;letter-spacing:.45em;color:var(--accent);margin-block-end:1.1em}
.doc h1{font-family:var(--serif);font-weight:700;font-size:2.1em;line-height:1.3;letter-spacing:.05em;margin-block:0 .5em}
.lede{font-family:var(--serif);font-size:1.12em;color:var(--ink-2);line-height:1.85;margin-block:0 1.4em;text-align:start}
.meta{font-size:.76em;color:var(--muted);letter-spacing:.05em}
.meta span+span::before{content:"·";margin-inline:.9em}
.doc h2{font-family:var(--serif);font-weight:700;font-size:1.42em;line-height:1.45;letter-spacing:.04em;margin-block:2.6em .9em;display:flex;align-items:center;gap:.7em}
.doc h2 .no{flex:none;width:1.55em;height:1.55em;display:grid;place-items:center;font-size:.6em;font-weight:600;color:var(--accent);border:1px solid currentColor;border-radius:3px;transform:rotate(-3deg)}
.doc h3{font-weight:600;font-size:1.05em;margin-block:2em .6em}
.doc h3::before{content:"";display:inline-block;width:.9em;height:1px;background:var(--accent);vertical-align:middle;margin-inline-end:.6em}
.vert .doc h3::before{width:1px;height:.9em}
.doc p{margin-block:0 1.15em}
.doc strong{font-weight:650}
.doc em{font-style:normal;text-emphasis:filled dot var(--accent);-webkit-text-emphasis:filled dot var(--accent);text-emphasis-position:under right;-webkit-text-emphasis-position:under}
.doc a{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:.3em}
.doc a:hover{color:var(--accent)}
.doc code{font-family:var(--mono);font-size:.86em;background:var(--paper-2);padding:.1em .38em;border-radius:4px}
.doc blockquote{margin-block:1.9em;margin-inline:0;padding-inline-start:1.6em;border-inline-start:2px solid var(--rule-2);font-family:var(--serif);color:var(--ink-2);font-size:1.08em;text-align:start}
.doc blockquote p{margin-block:0 .4em}
.doc blockquote cite{display:block;font-style:normal;font-size:.78em;color:var(--muted);letter-spacing:.08em}
.callout{position:relative;margin-block:1.7em;padding:1em 1.3em;background:var(--accent-soft);border-radius:10px;text-align:start}
.callout::before{content:"";position:absolute;inset-inline-start:0;inset-block:.9em;inline-size:2px;background:var(--accent);border-radius:2px}
.callout .lab{display:block;font-family:var(--serif);font-size:.76em;letter-spacing:.35em;color:var(--accent);margin-block-end:.25em}
.callout p{margin:0}
.doc table{border-collapse:collapse;width:100%;margin-block:1.8em 2em;font-size:.88em;text-align:left}
.doc th{font-weight:600;color:var(--ink-2);font-size:.9em;letter-spacing:.06em;padding:.6em 1em;border-top:1.5px solid var(--ink-2);border-bottom:1px solid var(--ink-2);text-align:left}
.doc td{padding:.6em 1em;border-bottom:1px solid var(--rule)}
.doc tbody tr:last-child td{border-bottom:1.5px solid var(--ink-2)}
.codebox{position:relative;margin-block:1.6em 1.9em;background:var(--paper-2);border-radius:10px}
.codebox .lang{position:absolute;top:10px;left:16px;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.codebox .copy{position:absolute;top:8px;right:10px;display:flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:6px;color:var(--ink-2);background:var(--paper);border:1px solid var(--edge)}
.codebox .copy:hover{color:var(--accent);border-color:var(--accent)}
.codebox .copy svg{width:13px;height:13px}
.doc pre{margin:0;padding:40px 22px 20px;overflow-x:auto;font-family:var(--mono);font-size:.82em;line-height:1.7;text-align:left}
.doc pre code{background:none;padding:0;font-size:1em}
.k{color:var(--k)}.ty{color:var(--t)}.s{color:var(--s)}.n{color:var(--n)}.c{color:var(--c);font-style:italic}
.doc ul{margin-block:0 1.2em;padding-inline-start:1.6em;text-align:start}
.doc ul li::marker{color:var(--accent)}
.doc ul.tasks{list-style:none;padding-inline-start:.2em}
.doc ul.tasks li{display:flex;align-items:baseline;gap:.75em}
.cb{flex:none;width:.95em;height:.95em;border:1.3px solid var(--ink-2);border-radius:3px;transform:translateY(.12em);position:relative}
.cb.on{border-color:var(--accent);background:var(--accent)}
.cb.on::after{content:"";position:absolute;left:.26em;top:.08em;width:.26em;height:.5em;border:solid var(--paper);border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
li.done{color:var(--muted)}
.ornament{text-align:center;margin-block:3em 2.2em;color:var(--accent);opacity:.7;letter-spacing:1.2em;font-family:var(--serif)}
sup.fn a{font-size:.72em;color:var(--accent);text-decoration:none;padding:0 .15em;font-family:var(--latin)}
.footnotes{font-size:.8em;color:var(--ink-2);border-block-start:1px solid var(--rule);padding-block-start:1.4em}
.footnotes ol{padding-inline-start:1.3em}
.vert .codebox,.vert .doc table,.vert .footnotes{writing-mode:horizontal-tb;width:min(620px,62vw);max-height:calc(100vh - 230px);overflow:auto;margin:0 1.8em}
.vert .doc table{display:block}
.ribbon-demo{display:inline-block;width:.55em;height:1.1em;vertical-align:-.15em;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);margin-inline:.15em}

/* 查找：淡朱底 + 当前处朱笔圈 */
mark.hit{background:var(--wash);color:inherit;border-radius:2px}
mark.hit.cur{background:var(--wash);color:var(--accent);font-weight:600}
.circle{position:absolute;overflow:visible}
.circle path{fill:none;stroke:var(--accent);stroke-linecap:round;opacity:.9;animation:draw .5s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ================= 书签绳（就在滚动条的位置） ================= */
.strip{position:absolute;z-index:18;right:0;top:0;bottom:34px;width:24px;cursor:pointer}
.ticks{position:absolute;z-index:20;right:0;top:0;bottom:34px;width:24px;pointer-events:none}
.tick{position:absolute;right:4px;width:13px;height:1.5px;border-radius:1px;background:var(--faint);transform:translateY(-50%);transition:background-color .2s,transform .2s}
.tick.l3{right:7px;width:7px}
/* 绳子走过的刻度：在朱绳上刻出一道浅色刻痕 */
.tick.read{background:color-mix(in srgb,var(--paper) 80%,transparent)}
.tick.near{background:var(--accent);transform:translateY(-50%) scaleX(1.35)}
.tick.read.near{background:var(--paper);transform:translateY(-50%) scaleX(1.35)}.back{position:absolute;right:12px;height:24px;display:flex;align-items:center;transform:translateY(-50%);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
.back .flag{width:24px;height:16px;flex:none;background:var(--accent);clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%);display:grid;place-items:center;padding:0 5px 0 3px;justify-content:start;color:var(--paper);filter:brightness(.94)}
.back .flag svg{width:10px;height:10px;margin-left:3px}
.back.show{opacity:1;pointer-events:auto}
.back.show .flag{animation:backin .6s var(--ease)}
@keyframes backin{0%{transform:translateX(14px) scale(.6);opacity:0}60%{transform:translateX(-3px) scale(1.08)}100%{transform:none}}

.cord{position:absolute;z-index:19;right:5px;top:0;width:11px;cursor:grab;filter:drop-shadow(1px 2px 1.5px var(--shadow));touch-action:none;}
.cord i{display:block;width:100%;height:100%;background:linear-gradient(90deg,rgba(0,0,0,.14),transparent 28%,rgba(255,255,255,.22) 48%,transparent 66%,rgba(0,0,0,.12)),var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 9px),0 100%)}
.cord:hover i,.cord.pulling i{filter:brightness(1.08)}
.cord.pulling{cursor:grabbing}
.cord::after{content:"";position:absolute;inset:0 -4px 0 -5px}
/* 竖排：书签绳横在页脚上方，从右往左走 */
.vert-ui .strip{right:0;left:0;top:auto;bottom:34px;height:40px;width:auto}
.vert-ui .ticks{left:0;right:0;top:auto;bottom:34px;height:40px;width:auto}
.vert-ui .tick{top:auto;bottom:11px;width:1.5px;height:15px;transform:translateX(50%)}
.vert-ui .tick.near{transform:translateX(50%) scaleY(1.35)}
.vert-ui .tick.l3{height:7px;bottom:15px;width:1.5px}
.vert-ui .back{right:auto;bottom:22px;height:auto;transform:translateX(-50%)}
.vert-ui .back .flag{width:20px;height:26px;clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%);padding:0 0 6px}
.vert-ui .cord{right:0;top:auto;bottom:47px;height:11px;width:auto}
.vert-ui .cord i{background:linear-gradient(0deg,rgba(0,0,0,.14),transparent 28%,rgba(255,255,255,.22) 48%,transparent 66%,rgba(0,0,0,.12)),var(--accent);clip-path:polygon(100% 0,100% 100%,0 100%,9px 50%,0 0)}
.vert-ui .cord::after{inset:-9px 0}
.tip{position:fixed;z-index:80;font-size:12px;padding:5px 10px;border-radius:6px;background:var(--ink);color:var(--paper);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;line-height:1.5}
.tip.show{opacity:.94}
.tip kbd{background:transparent;color:inherit;border-color:rgba(127,127,127,.6);margin-left:6px}

/* ================= 页脚：当前章节 + 统计 ================= */
.foot{position:absolute;z-index:20;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 20px;font-size:12px;color:var(--muted);user-select:none}
.foot::before{content:"";position:absolute;inset:-26px 0 0 0;z-index:-1;background:linear-gradient(color-mix(in srgb,var(--paper) 0%,transparent),var(--paper) 55%)}
.foot .ch{font-family:var(--serif);color:var(--ink-2);letter-spacing:.08em;display:flex;align-items:center;gap:.7em;white-space:nowrap;overflow:hidden;min-width:0}
.foot .ch > span{overflow:hidden;text-overflow:ellipsis}
.foot .ch.link{font-family:var(--sans);letter-spacing:0;color:var(--ink-2)}
.foot .ch.link svg{width:11px;height:11px;flex:none;color:var(--accent)}
.foot .ch .fish{width:8px;height:10px;color:var(--accent);flex:none}
.foot .st{display:flex;gap:16px;white-space:nowrap}
.foot .saved{color:var(--accent)}

/* ================= 查找栏 ================= */
.findbar{position:absolute;z-index:28;top:10px;right:30px;display:flex;align-items:center;gap:2px;padding:5px 6px 5px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--edge);box-shadow:0 14px 34px -18px var(--shadow);
  transform:translateY(-8px);opacity:0;pointer-events:none;transition:all .28s var(--ease)}
.findbar.open{transform:none;opacity:1;pointer-events:auto}
.findbar>svg{width:15px;height:15px;color:var(--muted);margin-right:6px}
.findbar input{border:0;outline:0;background:none;font:inherit;font-size:13.5px;color:var(--ink);width:210px}
.findbar input::placeholder{color:var(--muted)}
.findbar .cnt{font-size:12px;color:var(--muted);min-width:48px;text-align:right;margin-right:6px;font-variant-numeric:tabular-nums}
.ib{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2)}
.ib:hover{background:var(--paper-2);color:var(--ink)}
.ib svg{width:15px;height:15px}

/* ================= 目录（卷目） ================= */
.juan{position:fixed;inset:44px 0 0 0;z-index:40;background:color-mix(in srgb,var(--paper) 95%,transparent);backdrop-filter:blur(8px);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.juan.open{opacity:1;pointer-events:auto}
.juan-close{position:absolute;top:16px;right:22px;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12.5px;color:var(--ink-2);border:1px solid var(--edge);background:var(--paper)}
.juan-close:hover{color:var(--ink);border-color:var(--rule-2)}
.juan-in{max-width:600px;margin:0 auto;padding:9vh 40px 80px;transform:translateY(10px);transition:transform .45s var(--ease)}
.juan.open .juan-in{transform:none}
.juan h2{font-family:var(--serif);text-align:center;font-size:24px;letter-spacing:1em;padding-left:1em;margin:0 0 .4em}
.juan .sub{text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:.1em;margin-bottom:2.6em}
.jm{display:flex;align-items:baseline;padding:9px 10px;font-family:var(--serif);font-size:16px;cursor:pointer;border-radius:8px;transition:background-color .2s,color .2s}
.jm:hover,.jm:focus-visible{background:var(--accent-soft);color:var(--accent)}
.jm:focus-visible{outline:none;box-shadow:inset 2px 0 0 var(--accent)}
.jm .no{width:2.4em;flex:none;color:var(--accent);font-size:14px}
.jm .lead{flex:1;border-bottom:1px dotted var(--rule-2);margin:0 12px;transform:translateY(-.3em);min-width:20px}
.jm .pg{font-family:var(--latin);color:var(--muted);font-size:14px}
.jm.l1{font-size:19px;font-weight:700;margin-bottom:.5em}
.jm.l3{font-family:var(--sans);font-size:13.5px;color:var(--ink-2);padding-left:calc(2.4em + 10px)}
.jm.l3 .no{display:none}
.jm.cur{color:var(--accent)}
.jm .here{font-family:var(--sans);font-size:11px;color:var(--paper);background:var(--accent);padding:1px 7px;border-radius:10px;margin-left:10px}

/* ================= 弹出面板与菜单 ================= */
.pop{position:fixed;z-index:50;top:46px;width:330px;padding:16px;border-radius:14px;background:var(--paper);border:1px solid var(--edge);box-shadow:0 24px 50px -24px var(--shadow);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:all .25s var(--ease)}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop h4{margin:2px 4px 10px;font-size:12px;letter-spacing:.2em;color:var(--muted);font-weight:500}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:10px;text-align:left;transition:background-color .2s}
.opt:hover{background:var(--paper-2)}
.opt .sw{width:44px;height:32px;border-radius:7px;flex:none;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);overflow:hidden;padding:7px 7px;display:flex;flex-direction:column;gap:4px}
.opt .sw i{display:block;height:2px;border-radius:2px}
.opt .sw i:first-child{width:60%}.opt .sw i:nth-child(2){width:88%;opacity:.55}.opt .sw i:nth-child(3){width:75%;opacity:.55}
.opt .sw b{position:absolute;right:6px;top:0;width:4px;height:62%;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.opt .sw.auto{background:linear-gradient(135deg,#f6f1e7 50%,#1c1a18 50%)}
.opt .nm{font-size:13.5px;color:var(--ink);display:block}
.opt .ds{font-size:12px;color:var(--muted);display:block;margin-top:1px}
.opt .ck{margin-left:auto;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--rule-2);flex:none;position:relative}
.opt.on .ck{border-color:var(--accent);background:var(--accent)}
.opt.on .ck::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--paper);border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.prow{display:flex;align-items:center;justify-content:space-between;padding:11px 6px 4px;margin-top:8px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-2)}
.prow .seg{margin:0}
.hcnote{margin:6px 6px 2px;font-size:12px;color:var(--muted);line-height:1.6}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:28px;height:28px;border-radius:7px;border:1px solid var(--edge)}
.stepper button:hover{background:var(--paper-2)}
.stepper span{min-width:46px;text-align:center;font-size:12.5px}
.menu{width:250px;padding:6px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--ink);text-align:left}
.mi:hover,.mi:focus-visible{background:var(--paper-2)}
.mi:disabled{opacity:.4;pointer-events:none}
.mi svg{width:15px;height:15px;color:var(--ink-2)}
.mi kbd{margin-left:auto}
.mhr{height:1px;background:var(--rule);margin:5px 8px}

/* 命令面板 */
.pal-wrap{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--desk) 45%,transparent);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding-top:13vh;opacity:0;pointer-events:none;transition:opacity .22s}
.pal-wrap.open{opacity:1;pointer-events:auto}
.pal{width:min(580px,92vw);border-radius:14px;background:var(--paper);border:1px solid var(--edge);box-shadow:0 40px 80px -30px var(--shadow);overflow:hidden}
.pal-wrap.open .pal{animation:unroll .45s var(--ease)}
@keyframes unroll{from{clip-path:inset(0 0 100% 0 round 14px)}to{clip-path:inset(0 0 0 0 round 14px)}}
.pal-in{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--rule)}
.pal-in svg{width:18px;height:18px;color:var(--muted)}
.pal-in input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:15.5px;color:var(--ink)}
.pal-in input::placeholder{color:var(--muted)}
.pal-list{max-height:50vh;overflow-y:auto;padding:8px}
.pal-grp{font-size:11.5px;letter-spacing:.2em;color:var(--muted);padding:10px 12px 6px}
.pal-it{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;font-size:14px;color:var(--ink);cursor:pointer}
.pal-it .sub{font-size:12px;color:var(--muted)}
.pal-it kbd{margin-left:auto}
.pal-it.sel{background:var(--accent-soft)}
.pal-it b{color:var(--accent);font-weight:600}
.pal-empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}

/* ================= 编辑（信笺） ================= */
.letter{padding:0 48px 110px}
.editbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;height:44px;margin:0 -48px 18px;padding:0 48px;background:var(--paper);border-bottom:1px solid var(--rule);font-size:12.5px;color:var(--muted)}
.editbar .mode{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:600}
.editbar .mode svg{width:14px;height:14px}
.editbar .state{display:flex;align-items:center;gap:6px}
.editbar .state i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.editbar .state.clean i{background:none;border:1.3px solid var(--muted);width:7px;height:7px}
.editbar .sp{flex:1}
.editbar button{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:7px;border:1px solid var(--edge);background:var(--paper);color:var(--ink);font-size:12.5px;transition:all .2s}
.editbar button:hover{border-color:var(--accent);color:var(--accent)}
.editbar button kbd{font-size:10.5px;color:var(--muted)}
.editbar #esSave:disabled{opacity:.45;pointer-events:none}
.editbar #esSave:not(:disabled){background:var(--accent);border-color:var(--accent);color:#fbf3e8}
.editbar #esSave:not(:disabled) kbd{color:inherit;background:transparent;border-color:rgba(255,255,255,.45)}
pre.src{margin:0 0 0 3.2em;font-family:var(--mono);font-size:calc(var(--fs) * .86);line-height:2em;white-space:pre-wrap;word-break:break-word;counter-reset:l;outline:none;caret-color:var(--accent);position:relative;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2em - 1px),var(--letter) calc(2em - 1px),var(--letter) 2em);border-left:3px double var(--letter);padding-left:1.2em}
pre.src .ln{display:block;position:relative;min-height:2em}
pre.src .ln.cur::after{content:"";position:absolute;left:-1.2em;right:0;bottom:0;height:1.5px;background:var(--accent);opacity:.8;pointer-events:none;animation:rulerin .25s var(--ease)}
@keyframes rulerin{from{transform:scaleX(.96);opacity:0}to{transform:none;opacity:.8}}
pre.src .ln::before{counter-increment:l;content:counter(l);position:absolute;left:-4.4em;width:2.6em;text-align:right;color:var(--muted);font-size:.8em;user-select:none}
.m-mk{color:var(--muted)}.m-h{font-weight:700}.m-h1{color:var(--accent)}.m-code{color:var(--t)}.m-fence{color:var(--muted)}.m-link{color:var(--accent)}.m-url{color:var(--muted)}.m-b{font-weight:700}.m-q{color:var(--ink-2)}

/* ================= 起始页 ================= */
.home{max-width:1180px;margin:0 auto;padding:56px 56px 90px;display:grid;grid-template-columns:1fr auto;gap:56px}
.sec{font-size:12px;letter-spacing:.25em;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:12px}
.sec::after{content:"";flex:1;height:1px;background:var(--rule)}
.cont{position:relative;display:grid;grid-template-columns:1fr auto;gap:6px 28px;align-items:center;padding:26px 28px 22px 34px;margin-bottom:38px;background:var(--paper);border:1px solid var(--edge);border-radius:6px;cursor:pointer;
  box-shadow:0 1px 2px var(--shadow),0 16px 36px -26px var(--shadow);transition:transform .35s var(--ease),box-shadow .35s}
.cont:hover{transform:translateY(-2px);box-shadow:0 2px 4px var(--shadow),0 24px 48px -28px var(--shadow)}
.cont::before{content:"";position:absolute;left:-1px;top:-1px;width:10px;height:40px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.cont h3{font-family:var(--serif);font-size:24px;margin:0;letter-spacing:.03em}
.cont p{margin:6px 0 0;color:var(--ink-2);font-size:14px;line-height:1.7}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9px;font-size:13.5px;white-space:nowrap;border:1px solid var(--edge);background:var(--paper);color:var(--ink);transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fbf3e8}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn svg{width:15px;height:15px}
.cont .where{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:12px}
.cont .prog{grid-column:1/-1;height:2px;background:var(--rule);position:relative;margin-top:14px}
.cont .prog i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-bottom:34px}
.card{padding:18px 20px 14px;background:var(--paper);border:1px solid var(--edge);border-radius:5px;cursor:pointer;transform:rotate(var(--r));
  box-shadow:0 1px 2px var(--shadow),0 10px 24px -20px var(--shadow);transition:transform .35s var(--ease),box-shadow .35s}
.card:hover{transform:rotate(0) translateY(-4px);box-shadow:0 2px 4px var(--shadow),0 20px 40px -24px var(--shadow)}
.card .nm{font-family:var(--serif);font-weight:700;font-size:16px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ex{font-size:12.5px;color:var(--ink-2);line-height:1.7;height:3.4em;overflow:hidden;margin-bottom:12px}
.card .ft{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--rule);padding-top:9px}
.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 20px;border:1.5px dashed var(--rule-2);border-radius:12px;color:var(--muted);font-size:13px;transition:all .3s}
body.dragover .actions{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.greet-col{writing-mode:vertical-rl;display:flex;flex-direction:column;align-items:flex-start;gap:22px;padding-top:6px}
.greet{font-family:var(--serif);font-size:50px;font-weight:700;letter-spacing:.18em;margin:0;line-height:1.2}
.gdate{font-family:var(--serif);color:var(--ink-2);font-size:15px;letter-spacing:.35em;margin:0;padding-top:10px}
.gstamp{width:32px;padding:6px 0;background:var(--accent);color:#fbf3e8;font-family:var(--serif);font-size:13px;font-weight:700;letter-spacing:.15em;text-align:center;border-radius:3px;transform:rotate(3deg);box-shadow:inset 0 0 0 1.5px rgba(255,245,230,.5),inset 0 0 0 3px var(--accent);margin-top:10px}

/* ================= 其他 ================= */
.bubble{position:fixed;z-index:45;display:flex;gap:2px;padding:4px;border-radius:10px;background:var(--ink);box-shadow:0 10px 30px -12px var(--shadow);opacity:0;pointer-events:none;transform:translate(-50%,4px);transition:opacity .15s,transform .15s}
.bubble.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.bubble button{display:flex;align-items:center;gap:6px;color:var(--paper);font-size:12.5px;padding:5px 11px;border-radius:7px}
.bubble button:hover{background:rgba(127,127,127,.25)}
.bubble svg{width:13px;height:13px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;background:var(--ink);transform:rotate(45deg);border-radius:2px}
.slipnote{position:fixed;z-index:45;max-width:320px;padding:14px 18px;background:var(--paper-2);border:1px solid var(--edge);border-radius:3px;font-size:13px;line-height:1.8;color:var(--ink-2);box-shadow:0 14px 30px -16px var(--shadow);transform:rotate(-1deg) translateY(4px);opacity:0;pointer-events:none;transition:all .2s var(--ease)}
.slipnote.show{opacity:1;transform:rotate(-1deg)}
.toast{position:fixed;z-index:90;left:50%;bottom:52px;transform:translate(-50%,10px);padding:8px 18px;border-radius:20px;background:var(--ink);color:var(--paper);font-size:13px;opacity:0;pointer-events:none;transition:all .3s var(--ease)}
.toast.show{opacity:.95;transform:translate(-50%,0)}
@media (max-width:820px){.greet-col{display:none}.home{grid-template-columns:1fr;padding:40px 28px}}
@media (forced-colors: active){
  .paper::before,.paper::after{display:none}
  .cord i,.back .flag,.opt .sw b,.ribbon-demo{forced-color-adjust:none;background:Highlight}
  .back .flag{color:HighlightText}
  .tab.active,.pop,.pal,.findbar,.card,.cont,.tb.on,.seg button.on,.codebox,.callout,.editbar button{border:1px solid CanvasText}
  mark.hit{forced-color-adjust:none;background:Mark;color:MarkText}
  mark.hit.cur{background:Highlight;color:HighlightText}
  .circle path{stroke:Highlight}
  :focus-visible{outline:2px solid Highlight}
  .foot{background:Canvas;border-top:1px solid CanvasText}
  .foot::before{display:none}
  .tip,.toast,.bubble{border:1px solid CanvasText}
  .tab .dot{forced-color-adjust:none;background:CanvasText}
  .tick{forced-color-adjust:none;background:CanvasText}
  .tick.read{background:HighlightText}
}
</style>
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <header class="bar" id="titlebar">
    <button class="seal" id="seal" data-tip="命令面板" data-kbd="Ctrl+K"><i>阅</i></button>
    <nav class="tabs" id="tabs" role="tablist" aria-label="打开的文档"></nav>
    <div class="drag"></div>
    <div class="tools">
      <button class="tb" id="tFind" data-tip="在文档中查找" data-kbd="Ctrl+F"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8.6" cy="8.6" r="5.1"/><path d="M12.4 12.4 16.6 16.6"/></svg><span>查找</span></button>
      <button class="tb" id="tToc" data-tip="打开目录" data-kbd="Ctrl+Shift+O"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 5h13M7 10h9.5M7 15h9.5"/><circle cx="3.8" cy="10" r=".7" fill="currentColor"/><circle cx="3.8" cy="15" r=".7" fill="currentColor"/></svg><span>目录</span></button>

  <p>右侧那根朱红的丝带<span class="ribbon-demo"></span>就是<strong>书签绳</strong>。它挂在 Windows 用户找滚动条的地方，所以不用教：读得越多，垂得越长；抓住绳子任何地方都能拖；点绳子或旁边细线上的任何位置，就跳到那里——往前、往后都行。</p>

  <div class="callout"><span class="lab">新增</span><p>通过目录、刻痕或查找跳走以后，细线上会留下一枚小书签，标出<strong>刚才读到的地方</strong>。点它或按 <kbd>Alt</kbd> <kbd>←</kbd> 就回去，像真的书签一样。</p></div>

  <p>第二稿的书眉搬到了<strong>页脚</strong>：左下角写着你正在读的章节，右下角是字数和进度。书的页脚本来就写这些。</p>
  <p>页脚也兼任状态栏：鼠标停在<a href="https://learn.microsoft.com/zh-cn/windows/win32/directwrite/direct-write-portal">外部链接</a>上，左下角显示网址；停在<a href="#sec-zhubi">站内链接</a>上，显示要跳去的章节。</p>

  <p>选中一段文字，上方会浮出「复制」和「查找」。脚注像一张夹在书里的便笺<sup class="fn"><a href="#" data-fn="1">1</a></sup>。</p>

];

}
function setTheme(p, ev){

function renderTabs(){
  $('#tabs').innerHTML = open.map(id => { const d = docs[id];
    return `<div class="tab ${d.kind==='home'?'is-home':''} ${id===active?'active':''} ${d.dirty?'dirty':''} ${d.drying?'drying':''} ${d.fresh?'fresh-ink':''}" role="tab" tabindex="${id===active?0:-1}" aria-selected="${id===active}" data-id="${id}" data-tip="${d.path?d.path.join('\\'):'最近的文件'}">

    </div>`; }).join('') + `<button class="tab-add" id="tabAdd" data-tip="打开文件" data-kbd="Ctrl+O"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg></button>`;
}
$('#tabs').addEventListener('mousedown', e => {
  const x = e.target.closest('[data-close]'); if (x){ e.stopPropagation(); closeTab(x.dataset.close); return; }
  if (e.target.closest('#tabAdd')) return toast('打开文件 · 演示中未接入文件系统');
  const t = e.target.closest('.tab'); if (t) go(t.dataset.id);
});
$('#tabs').addEventListener('keydown', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  const i = open.indexOf(t.dataset.id);
  if (e.key==='ArrowRight' || e.key==='ArrowLeft'){ e.preventDefault(); const n = open[(i + (e.key==='ArrowRight'?1:-1) + open.length) % open.length]; go(n); focusTab(n); }
  else if (e.key==='Delete' && docs[t.dataset.id].kind!=='home'){ e.preventDefault(); closeTab(t.dataset.id); focusTab(active); }
});
function focusTab(id){ requestAnimationFrame(() => $('#tabs').querySelector(`.tab[data-id="${id}"]`)?.focus()); }
function cycleTab(d){ const n = open[(open.indexOf(active)+d+open.length)%open.length]; go(n); }
function closeTab(id){
  const d = docs[id];
  if (d.dirty) return toast('「'+d.title+'」有未保存的修改：会询问 保存 / 不保存 / 取消');
  const i = open.indexOf(id); open.splice(i,1); closed.push(id);
  if (active===id) go(open[Math.min(i, open.length-1)]); else renderTabs();
  toast('已关闭 · Ctrl+Shift+T 重新打开');
}
function reopen(){ const id = closed.pop(); if (!id) return toast('没有关闭过的标签'); open.push(id); go(id); }

function go(id){ quiet(false); pos[key()] = curScroll(); active = id; closeAll(); lastPos = null; $('#back').classList.remove('show'); if (savedNote==='Alt+← 返回') note('', 0); renderTabs(); render(); }
function render(){
  const d = docs[active], isHome = d.kind==='home';
  const v = vert && !isHome && mode==='read';
  scroll.classList.toggle('vert', v); paper.classList.toggle('vert-ui', v);
  $('#tFind').disabled = isHome;
  $('#tToc').disabled = isHome || mode==='write';
  $('#miVert').disabled = isHome || mode==='write'; $('#miVertT').textContent = vert ? '回到横排' : '竖排阅读';
  $('#modeSeg').classList.toggle('disabled', isHome);
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode===mode));
  view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
  if (isHome){ view.innerHTML = homeHTML(); wireHome(); }
  else if (mode==='write'){ view.innerHTML = letterHTML(d); wireLetter(); }
  else { view.innerHTML = document.getElementById(d.tpl).innerHTML + '<div id="inkLayer"></div>'; wireDoc(); }
  setScroll(pos[key()] || 0);
  requestAnimationFrame(() => { collectHeads(); buildTicks(); update(); });
}

function wireDoc(){

    const target = () => { if (ext) return null; const h = heads.find(h => h.el.id === href.slice(1)); return h; };

/* ================= 滚动几何（横竖通用） ================= */
let heads = [];
const isV = () => scroll.classList.contains('vert');
const maxScroll = () => isV() ? scroll.scrollWidth-scroll.clientWidth : scroll.scrollHeight-scroll.clientHeight;
const curScroll = () => isV() ? -scroll.scrollLeft : scroll.scrollTop;
function setScroll(v, smooth){ v = Math.max(0, Math.min(maxScroll(), v)); const b = smooth?'smooth':'auto'; if (isV()) scroll.scrollTo({left:-v, behavior:b}); else scroll.scrollTo({top:v, behavior:b}); }
function elPos(el){ const r = el.getBoundingClientRect(), s = scroll.getBoundingClientRect(); return isV() ? (s.right-r.right)+curScroll() : (r.top-s.top)+curScroll(); }
function collectHeads(){
  heads = (docs[active].kind!=='home' && mode==='read') ? [...view.querySelectorAll('.doc h1,.doc h2,.doc h3')].map(h => { const c = h.cloneNode(true); const no = c.querySelector('.no'); const n = no ? no.textContent : ''; no && no.remove(); return {el:h, lv:+h.tagName[1], no:n, t:c.textContent.trim()}; }) : [];
}
const OFF = 70, TOP = 36, BOT = 60;
const span = () => isV() ? paper.clientWidth-TOP-BOT : paper.clientHeight-34-TOP-BOT+34;
const pOf = v => { const m = maxScroll(); return m>0 ? Math.min(1, Math.max(0, v/m)) : 0; };
const at = p => TOP + p*span();
function place(el, p){ if (isV()){ el.style.right = at(p)+'px'; el.style.top=''; } else { el.style.top = at(p)+'px'; el.style.right=''; } }

/* ================= 书签绳 ================= */
function buildTicks(){
  const show = heads.length > 0;
  $('#strip').style.display = $('#cord').style.display = show ? '' : 'none';
  $('#ticks').innerHTML = heads.map((h,i) => h.lv>1 ? `<div class="tick l${h.lv}" data-i="${i}"></div>` : '').join('');
  $('#ticks').querySelectorAll('.tick').forEach(t => place(t, pOf(elPos(heads[+t.dataset.i].el)-OFF)));
  if (lastPos!==null) place($('#back'), pOf(lastPos));
}
let lastPos = null;
function remember(){ const b = $('#back'); lastPos = curScroll(); place(b, pOf(lastPos)); b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); note('Alt+← 返回', 3000); }
function goBack(){ if (lastPos===null) return false; const v = lastPos; $('#back').classList.remove('show'); if (savedNote==='Alt+← 返回') note('', 0); lastPos = null; hideTip(); setScroll(v, true); return true; }
function jumpTo(i, mark=true){ const h = heads[i]; if (!h) return; if (mark) remember(); setScroll(elPos(h.el)-OFF+10, true); }
$('#back').addEventListener('click', e => { e.stopPropagation(); goBack(); });
$('#back').addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' '){ e.preventDefault(); goBack(); } });
function nearTick(e){
  let best = null, bd = 7;
  $('#ticks').querySelectorAll('.tick').forEach(t => { const r = t.getBoundingClientRect(); const d = isV() ? Math.abs(e.clientX-(r.left+r.width/2)) : Math.abs(e.clientY-(r.top+r.height/2)); if (d < bd){ bd = d; best = t; } });
  return best;
}
let nearT = null;
function hoverStrip(e){
  if (dragging) return;
  const t = nearTick(e);
  if (t !== nearT){ nearT && nearT.classList.remove('near'); t && t.classList.add('near'); nearT = t; }
  if (t){ showTip(t, heads[+t.dataset.i].t); return; }
  if (e.target.closest('#cord')) return showTip(cord, `已读 ${Math.round(pOf(curScroll())*100)}%`);
  hideTip();
}
function leaveStrip(){ nearT && nearT.classList.remove('near'); nearT = null; hideTip(); }
['#strip','#cord'].forEach(sel => { $(sel).addEventListener('mousemove', e => { if (!e.target.closest('#back')) hoverStrip(e); }); $(sel).addEventListener('mouseleave', leaveStrip); });
$('#strip').addEventListener('click', e => {
  if (e.target.closest('#back')) return;
  const t = nearTick(e); if (t) return jumpTo(+t.dataset.i);
  const r = paper.getBoundingClientRect();
  const p = isV() ? (r.right-e.clientX-TOP)/span() : (e.clientY-r.top-TOP)/span();
  remember(); setScroll(Math.max(0,Math.min(1,p))*maxScroll(), true);
});
const cord = $('#cord'); let dragging = false;
let grab = null;
const axis = e => isV() ? -e.clientX : e.clientY;
cord.addEventListener('pointerdown', e => { if (e.button!==0) return; grab = {a:axis(e), v:curScroll(), moved:false}; cord.setPointerCapture(e.pointerId); e.preventDefault(); hideTip(); });
cord.addEventListener('pointermove', e => {
  if (!grab) return; const d = axis(e) - grab.a;
  if (!grab.moved && Math.abs(d) < 4) return;
  if (!grab.moved){ grab.moved = true; dragging = true; cord.classList.add('pulling'); }
  setScroll(grab.v + d / span() * maxScroll());
});
cord.addEventListener('pointerup', e => {
  const g = grab; grab = null; dragging = false; cord.classList.remove('pulling'); if (!g || g.moved) return;
  // 没拖动 = 点击：点在刻度旁就跳到那一章，否则跳到被点的位置（往回看）
  const t = nearTick(e); if (t) return jumpTo(+t.dataset.i);
  const r = paper.getBoundingClientRect();
  const p = isV() ? (r.right-e.clientX-TOP)/span() : (e.clientY-r.top-TOP)/span();
  const v = Math.max(0,Math.min(1,p))*maxScroll();
  if (Math.abs(v - curScroll()) < 12) return;
  remember(); setScroll(v, true);
});
cord.addEventListener('pointercancel', () => { grab = null; dragging = false; cord.classList.remove('pulling'); });

function update(){
  const d = docs[active], m = maxScroll(), p = m>0 ? curScroll()/m : 0;
  const len = TOP + p*span();
  if (isV()){ cord.style.width = len+'px'; cord.style.height=''; } else { cord.style.height = len+'px'; cord.style.width=''; }
  let ci = -1; heads.forEach((h,i) => { if (h.lv>1 && elPos(h.el) <= curScroll()+OFF+24) ci = i; });
  $('#ticks').querySelectorAll('.tick').forEach(t => t.classList.toggle('read', +t.dataset.i <= ci));
  const fish = '<svg class="fish" viewBox="0 0 8 10"><path d="M0 0H8V10L4 7 0 10Z" fill="currentColor"/></svg>';
  const f = $('#foot');
  if (d.kind==='home'){ f.innerHTML = `<span class="ch">起始页</span><span class="st"><span>${open.length-1} 个文档已打开</span></span>`; return; }
  const text = (view.querySelector('.doc')||view).innerText || '';
  const words = (text.match(/[\u4e00-\u9fff]/g)||[]).length + (text.match(/[A-Za-z0-9]+/g)||[]).length;
  if (mode==='read' && p > .01){ d.p = p; d.words = words; d.ch = ci>=0 ? heads[ci].t : '开篇'; }
  if (hoverLink && mode==='read'){ const arrow = hoverLink.ext ? '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 2.5h5.5V8M9.5 2.5 2.5 9.5"/></svg>' : '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h8M6.5 2.5 10 6 6.5 9.5"/></svg>';
    const st = f.querySelector('.st'); f.innerHTML = `<span class="ch link">${arrow}<span>${esc(hoverLink.t)}</span></span>`; if (st) f.appendChild(st); return; }
  const ch = mode==='write' ? (caret||'第 1 行') : (ci>=0 ? `${heads[ci].no?heads[ci].no+' · ':''}${heads[ci].t}` : '开篇');
  f.innerHTML = `<span class="ch">${fish}<span>${ch}</span></span><span class="st">${savedNote?`<span class="saved">${savedNote}</span>`:''}${mode==='write'?`<span>Markdown · UTF-8</span>`:`<span>${words.toLocaleString()} 字</span><span>已读 ${Math.round(p*100)}%</span>`}${zoom!==1?`<span>${Math.round(zoom*100)}%</span>`:''}</span>`;
}
let lastY = 0;
const tbar = $('#titlebar');
function quiet(on){ tbar.classList.toggle('quiet', on); }
scroll.addEventListener('scroll', () => { update(); $('#bubble').classList.remove('show');
  const y = curScroll(), dy = y - lastY;
  if (mode==='read' && docs[active].kind!=='home' && !tbar.matches(':hover,:focus-within')){ if (dy > 6 && y > 120) quiet(true); else if (dy < -30 || y < 60) quiet(false); }
  if (Math.abs(dy) > 6 || y < 60) lastY = y; }, {passive:true});
tbar.addEventListener('mouseenter', () => quiet(false));
tbar.addEventListener('focusin', () => quiet(false));
scroll.addEventListener('wheel', e => { if (isV() && Math.abs(e.deltaY) > Math.abs(e.deltaX)){ e.preventDefault(); scroll.scrollLeft -= e.deltaY; } }, {passive:false});

/* ================= 悬停提示：做什么 + 快捷键 ================= */
const tip = $('#tip'); let tipT;
function showTip(el, text, kbd){
  tip.innerHTML = text + (kbd?`<kbd>${kbd}</kbd>`:''); tip.classList.add('show');
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.left + r.width/2 - tw/2, y = r.bottom + 8;
  if (el.closest('#strip,#ticks') || el===cord){ if (isV()){ x = r.left + r.width/2 - tw/2; y = r.top - th - 10; } else { x = r.left - tw - 12; y = r.top + r.height/2 - th/2; } }
  if (y + th > innerHeight - 6) y = r.top - th - 8;
  tip.style.left = Math.max(6, Math.min(innerWidth-tw-6, x))+'px'; tip.style.top = y+'px';
}
function hideTip(){ tip.classList.remove('show'); clearTimeout(tipT); }
document.addEventListener('mouseover', e => {
  if (dragging) return;
  const tk = e.target.closest('.tick'), bk = e.target.closest('#back'), cd = e.target.closest('#cord'), dt = e.target.closest('[data-tip]');
  clearTimeout(tipT);
  if (bk) return showTip(bk, '返回', 'Alt+←');
  if (cd || e.target.closest('#strip')) return;
  if (dt && !e.target.closest('.pop.open')) { tipT = setTimeout(() => showTip(dt, dt.dataset.tip, dt.dataset.kbd), 380); return; }
  hideTip();
});
document.addEventListener('mousedown', hideTip);

/* ================= 查找 ================= */
let hits = [], hi = -1;
function openFind(){ if ($('#tFind').disabled) return; closePops(); $('#findbar').classList.add('open'); $('#tFind').classList.add('on'); const i = $('#findInput'); setTimeout(()=>{ i.focus(); i.select(); }, 40); if (i.value) runFind(); }
function closeFind(){ $('#findbar').classList.remove('open'); $('#tFind').classList.remove('on'); clearHits(); $('#findCnt').textContent=''; }
function clearHits(){ view.querySelectorAll('mark.hit').forEach(m => { const p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize(); }); hits=[]; hi=-1; const L=$('#inkLayer'); if (L) L.innerHTML=''; }
function runFind(){
  clearHits(); const q = $('#findInput').value; if (!q){ $('#findCnt').textContent=''; return; }
  const rt = view.querySelector('.doc, pre.src'); if (!rt) return;
  const w = document.createTreeWalker(rt, NodeFilter.SHOW_TEXT, {acceptNode:n => n.parentNode.closest('svg,.copy,.lang') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const ns = []; while (w.nextNode()) ns.push(w.currentNode);
  const ql = q.toLowerCase();
  ns.forEach(n => { const s = n.textContent, sl = s.toLowerCase(); let i = sl.indexOf(ql); if (i<0) return; const f = document.createDocumentFragment(); let last = 0;
    while (i>=0){ f.append(s.slice(last,i)); const m = document.createElement('mark'); m.className='hit'; m.textContent = s.slice(i,i+q.length); f.append(m); hits.push(m); last = i+q.length; i = sl.indexOf(ql,last); }
    f.append(s.slice(last)); n.parentNode.replaceChild(f, n); });
  const c = curScroll(); hi = Math.max(0, hits.findIndex(m => elPos(m) >= c)); showHit(false);
}
function showHit(mark){
  $('#findCnt').textContent = hits.length ? `${hi+1} / ${hits.length}` : '无结果';
  hits.forEach((m,i) => m.classList.toggle('cur', i===hi));
  const m = hits[hi], L = $('#inkLayer'); if (L) L.innerHTML=''; if (!m) return;
  const y = elPos(m), c = curScroll(), vis = isV() ? scroll.clientWidth : scroll.clientHeight;
  if (y < c+40 || y > c+vis-90){ if (mark && lastPos===null) remember(); setScroll(y - vis/3, true); }
  setTimeout(() => drawCircle(m), 360);
}
function drawCircle(m){
  const L = $('#inkLayer'); if (!L || !m.isConnected || !m.classList.contains('cur')) return; L.innerHTML='';
  const r = m.getClientRects()[0], v = view.getBoundingClientRect(); if (!r) return;
  const pad = 12, w = r.width+pad*2, h = r.height+pad*1.3, cx = w/2, cy = h/2, rx = w/2-3, ry = h/2-3, seed = Math.random()*10;
  let d=''; for (let k=0;k<=46;k++){ const t = -.5 + k/46*(Math.PI*2+.9), j = 1+Math.sin(t*3+seed)*.035+Math.sin(t*7+seed*2)*.02, g = 1+k/46*.07;
    d += (k?'L':'M') + (cx+Math.cos(t)*rx*j*g).toFixed(1)+' '+(cy+Math.sin(t)*ry*j*(2-g)).toFixed(1); }
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','circle'); svg.setAttribute('width',w); svg.setAttribute('height',h);
  svg.style.left = (r.left-v.left-pad)+'px'; svg.style.top = (r.top-v.top-pad*.65)+'px';
  svg.innerHTML = `<path d="${d}" stroke-width="1.8"/>`; L.appendChild(svg);

}

function setVert(v){ if (docs[active].kind==='home' || mode==='write') return; pos[key()] = curScroll(); vert = v; lastPos = null; $('#back').classList.remove('show'); if (savedNote==='Alt+← 返回') note('', 0); closeAll(); render(); toast(v ? '竖排阅读 · 滚轮左右翻，书签绳横在下方' : '已回到横排'); }

function setMode(m){ quiet(false); if (docs[active].kind==='home' || m===mode) return; pos[key()] = curScroll(); mode = m; caret=''; curLn = null; lastPos = null; $('#back').classList.remove('show'); if (savedNote==='Alt+← 返回') note('', 0); closeAll(); render(); }

function inlineMd(n){ let s=''; n.childNodes.forEach(c => { if (c.nodeType===3){ s+=c.textContent; return; } if (c.nodeType!==1) return; const tg=c.tagName;
  if (tg==='STRONG'||tg==='B') s+='**'+inlineMd(c)+'**'; else if (tg==='EM') s+='*'+inlineMd(c)+'*'; else if (tg==='CODE') s+='`'+c.textContent+'`';
  else if (tg==='KBD') s+='<kbd>'+c.textContent+'</kbd>'; else if (tg==='SUP') s+='[^'+c.textContent.trim()+']'; else if (c.classList.contains('ribbon-demo')) s+=''; else s+=inlineMd(c); }); return s; }
function toMd(a){ const out=[]; const walk = el => { for (const n of el.children){ const tg=n.tagName, cl=n.classList;
  if (cl.contains('doc-head')){ walk(n); continue; } if (cl.contains('kicker')||cl.contains('meta')) continue;
  if (/^H[1-3]$/.test(tg)){ const c=n.cloneNode(true); c.querySelectorAll('.no').forEach(x=>x.remove()); out.push('#'.repeat(+tg[1])+' '+c.textContent.trim()); }
  else if (tg==='P') out.push(inlineMd(n));
  else if (tg==='BLOCKQUOTE') out.push([...n.children].map(x=>'> '+inlineMd(x)).join('\n'));
  else if (cl.contains('callout')) out.push('> [!NOTE]\n> '+inlineMd(n.querySelector('p')));
  else if (cl.contains('codebox')) out.push('```'+n.querySelector('.lang').textContent.toLowerCase()+'\n'+n.querySelector('code').textContent+'\n```');
  else if (tg==='TABLE'){ const rows=[...n.querySelectorAll('tr')].map(r=>'| '+[...r.children].map(c=>inlineMd(c).trim()).join(' | ')+' |'); rows.splice(1,0,'|'+rows[0].split('|').slice(1,-1).map(()=>' --- ').join('|')+'|'); out.push(rows.join('\n')); }
  else if (tg==='UL') out.push([...n.children].map(li=>'- '+(li.querySelector('.cb')?(li.querySelector('.cb.on')?'[x] ':'[ ] '):'')+inlineMd(li).trim()).join('\n'));
  else if (cl.contains('ornament')) out.push('---');
  else if (cl.contains('footnotes')) out.push([...n.querySelectorAll('li')].map((li,i)=>'[^'+(i+1)+']: '+inlineMd(li)).join('\n'));
}}; walk(a); return out.join('\n\n'); }
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function ci(s){ return s.replace(/`([^`]+)`/g,'<span class="m-mk">`</span><span class="m-code">$1</span><span class="m-mk">`</span>')
  .replace(/\*\*([^*]+)\*\*/g,'<span class="m-mk">**</span><span class="m-b">$1</span><span class="m-mk">**</span>')
  .replace(/(^|[^*])\*([^*]+)\*/g,'$1<span class="m-mk">*</span>$2<span class="m-mk">*</span>')
  .replace(/\[\^(\d+)\]/g,'<span class="m-link">[^$1]</span>'); }
function letterHTML(d){
  const t = document.createElement('div'); t.innerHTML = document.getElementById(d.tpl).innerHTML;
  let fence = false; const lines = toMd(t.querySelector('article')).split('\n').map(raw => { let l = esc(raw), m;
    if (/^```/.test(raw)){ fence = !fence; return `<span class="m-fence">${l}</span>`; } if (fence) return `<span class="m-code">${l}</span>`;
    if ((m = l.match(/^(#{1,6})\s(.*)$/))) return `<span class="m-mk">${m[1]}</span> <span class="m-h ${m[1].length===1?'m-h1':''}">${m[2]}</span>`;
    if ((m = l.match(/^(&gt;\s?)(.*)$/))) return `<span class="m-mk">${m[1]}</span><span class="m-q">${ci(m[2])}</span>`;
    if ((m = l.match(/^(\s*[-*]\s)(\[[ x]\]\s)?(.*)$/))) return `<span class="m-mk">${m[1]}${m[2]||''}</span>${ci(m[3])}`;
    if (/^\|/.test(l)) return l.replace(/\|/g,'<span class="m-mk">|</span>'); if (raw==='---') return `<span class="m-mk">${l}</span>`;
    return ci(l); });
  return `<div class="letter"><div class="editbar" id="editbar">
      <span class="mode"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M10.8 2.7 13.3 5.2 5.6 12.9 2.5 13.5 3.1 10.4z"/></svg>编辑中</span>
      <span class="state" id="esState"></span><span class="sp"></span>
      <button id="esSave" data-tip="保存到文件">保存<kbd>Ctrl+S</kbd></button>
      <button id="backRead" data-tip="回到阅读，改动会保留">完成<kbd>Ctrl+E</kbd></button></div>
    <pre class="src" id="src" contenteditable="true" spellcheck="false">${lines.map(l=>`<span class="ln">${l}</span>`).join('')}</pre></div>`;
}
let caret = '', curLn = null;
function ruler(){ const s = $('#src'); if (!s) return; const sel = getSelection(); if (!sel.rangeCount) return; let n = sel.anchorNode;
  while (n && !(n.classList && n.classList.contains('ln'))) n = n.parentNode; if (!n || !s.contains(n)) return;
  if (curLn !== n){ curLn && curLn.classList.remove('cur'); n.classList.add('cur'); curLn = n; }

/* ================= 命令面板 ================= */
const cmds = [
  {l:'打开文件…', k:'Ctrl+O', run:()=>toast('打开文件 · 演示中未接入文件系统')},

let items = [], sel = 0;
function hl(s,q){ if (!q) return s; const i = s.toLowerCase().indexOf(q.toLowerCase()); return i<0 ? s : s.slice(0,i)+'<b>'+s.slice(i,i+q.length)+'</b>'+s.slice(i+q.length); }
function renderPal(){
  const q = $('#palInput').value.trim(), ql = q.toLowerCase();
  const c = cmds.filter(x => x.l.toLowerCase().includes(ql));
  const f = recent.filter(x => x.nm.toLowerCase().includes(ql)).slice(0, q?6:3);

  let h='', lt=''; items.forEach((it,i) => { if (it.type!==lt){ h += `<div class="pal-grp">${it.type==='c'?'命令':'最近文件'}</div>`; lt = it.type; }

/* ================= 键盘 ================= */
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), c = e.ctrlKey||e.metaKey;

  }
  if ($('#palWrap').classList.contains('open')) return;
  if (c && k==='f'){ e.preventDefault(); openFind(); }
  else if (c && k==='e'){ e.preventDefault(); setMode(mode==='read'?'write':'read'); }
  else if (c && e.shiftKey && k==='o'){ e.preventDefault(); $('#juan').classList.contains('open') ? closeToc() : openToc(); }
